name: Reusable Docker Policy

on:
  workflow_call:
    inputs:
      run_docker:
        description: Run Docker validation without a Docker-related path change
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  docker_policy:
    name: Docker Policy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the repository Node.js version
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc

      - name: Detect Docker-related changes
        id: docker_changes
        env:
          FORCE_CHANGED: ${{ inputs.run_docker }}
        run: node scripts/ci/detect-changes.mjs docker

      - name: Prepare Compose environment
        if: steps.docker_changes.outputs.changed == 'true'
        run: cp apps/gateway-api/.env.example apps/gateway-api/.env.local

      - name: Validate Compose configuration
        id: compose
        if: steps.docker_changes.outputs.changed == 'true'
        run: docker compose -f infra/local/compose.local.yml config --quiet

      - name: Enforce Dockerfile policy
        id: dockerfile_roast
        if: steps.docker_changes.outputs.changed == 'true'
        uses: immanuwell/dockerfile-roast@82698f68cdc4f4cde884b8ead3bebb1ace820e29 # 1.4.13
        with:
          files: .
          image-tag: 1.4.13

      - name: Build development images
        id: docker_build
        if: steps.docker_changes.outputs.changed == 'true'
        run: docker compose -f infra/local/compose.local.yml build gateway-api persistence-mock

      - name: Write Docker policy summary
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.docker_build.outcome }}
          CHANGED: ${{ steps.docker_changes.outputs.changed }}
          COMPOSE_OUTCOME: ${{ steps.compose.outcome }}
          REASON: ${{ steps.docker_changes.outputs.reason }}
          ROAST_OUTCOME: ${{ steps.dockerfile_roast.outcome }}
        run: |
          {
            echo "## Docker Policy"
            echo ""
            echo "Docker validation required: ${CHANGED:-unknown}."
            echo "Reason: ${REASON:-unavailable}."
            echo "Compose validation: ${COMPOSE_OUTCOME:-skipped}."
            echo "Dockerfile Roast: ${ROAST_OUTCOME:-skipped}."
            echo "Development image build: ${BUILD_OUTCOME:-skipped}."
          } >> "$GITHUB_STEP_SUMMARY"
