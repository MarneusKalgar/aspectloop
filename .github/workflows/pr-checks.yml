name: PR Checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_docker:
        description: Run Docker validation even when no Docker path diff is available
        required: false
        default: false
        type: boolean
      run_web_e2e:
        description: Run mocked web E2E even when no web-relevant path changed
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  CI: 'true'
  PLAYWRIGHT_IMAGE_VERSION: '1.62.1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Keep the Node/npm bootstrap explicit while only Quality and Mocked Web E2E
  # share it. Reconsider a local composite action when a third job needs the
  # same complete bootstrap contract.
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js with npm download cache
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Resolve repository toolchain contract
        id: toolchain
        run: node scripts/ci/toolchain-contract.mjs export

      - name: Install exact npm version
        working-directory: ${{ runner.temp }}
        env:
          NPM_VERSION: ${{ steps.toolchain.outputs.npm-version }}
        run: npm install --global "npm@${NPM_VERSION}"

      - name: Assert toolchain contract
        run: node scripts/ci/toolchain-contract.mjs assert

      - name: Check dependency policy before installation
        id: dependency_policy
        run: node scripts/dependencies/check-policy.mjs

      - name: Install dependencies from lockfile
        id: install
        run: npm ci

      - name: Check install-script coverage
        id: install_scripts
        run: npm run deps:scripts:pending

      - name: Audit high and critical vulnerabilities
        id: dependency_audit
        run: npm run deps:audit

      - name: Detect dependency-policy changes
        id: dependency_changes
        run: node scripts/ci/detect-changes.mjs dependencies

      - name: Run deterministic verification
        id: verification
        run: npm run verify

      - name: Build all workspaces
        id: build
        run: npm run build

      - name: Test logging and privacy contract
        id: logging_tests
        run: npm run test:logging:run

      - name: Verify registry signatures and attestations
        id: dependency_signatures
        continue-on-error: true
        timeout-minutes: 2
        run: npm run deps:signatures

      - name: Write quality summary
        if: always()
        env:
          DEPENDENCY_CHANGES: ${{ steps.dependency_changes.outputs.changed }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          POLICY_OUTCOME: ${{ steps.dependency_policy.outcome }}
          SCRIPT_OUTCOME: ${{ steps.install_scripts.outcome }}
          AUDIT_OUTCOME: ${{ steps.dependency_audit.outcome }}
          SIGNATURE_OUTCOME: ${{ steps.dependency_signatures.outcome }}
          VERIFY_OUTCOME: ${{ steps.verification.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          LOGGING_TESTS_OUTCOME: ${{ steps.logging_tests.outcome }}
        run: |
          {
            echo "## Quality"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Lockfile installation | ${INSTALL_OUTCOME:-skipped} |"
            echo "| Dependency policy | ${POLICY_OUTCOME:-skipped} |"
            echo "| Install-script coverage | ${SCRIPT_OUTCOME:-skipped} |"
            echo "| High/critical audit | ${AUDIT_OUTCOME:-skipped} |"
            echo "| Registry signatures (advisory) | ${SIGNATURE_OUTCOME:-skipped} |"
            echo "| Deterministic verification | ${VERIFY_OUTCOME:-skipped} |"
            echo "| Workspace builds | ${BUILD_OUTCOME:-skipped} |"
            echo "| Logging/privacy contract | ${LOGGING_TESTS_OUTCOME:-skipped} |"
            echo ""
            echo "Dependency-policy surfaces changed: ${DEPENDENCY_CHANGES:-not-evaluated}."
          } >> "$GITHUB_STEP_SUMMARY"

  web_e2e_scope:
    name: Web E2E Scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      required: ${{ steps.web_changes.outputs.changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the repository Node.js version
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc

      - name: Detect web E2E changes
        id: web_changes
        env:
          FORCE_CHANGED: ${{ inputs.run_web_e2e }}
        run: node scripts/ci/detect-changes.mjs web_e2e

      - name: Write web E2E scope summary
        env:
          REASON: ${{ steps.web_changes.outputs.reason }}
          REQUIRED: ${{ steps.web_changes.outputs.changed }}
        run: |
          {
            echo "## Web E2E Scope"
            echo ""
            echo "Mocked browser workflow required: ${REQUIRED:-unknown}."
            echo "Reason: ${REASON:-unavailable}."
          } >> "$GITHUB_STEP_SUMMARY"

  mocked_web_e2e:
    name: Mocked Web E2E
    needs:
      - web_e2e_scope
    if: needs.web_e2e_scope.outputs.required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --user 1001
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js with npm download cache
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Resolve repository toolchain contract
        id: toolchain
        run: node scripts/ci/toolchain-contract.mjs export

      - name: Install exact npm version
        working-directory: ${{ runner.temp }}
        env:
          NPM_VERSION: ${{ steps.toolchain.outputs.npm-version }}
        run: |
          npm_prefix="${RUNNER_TEMP}/npm-global"
          npm install --global --prefix "$npm_prefix" "npm@${NPM_VERSION}"
          echo "$npm_prefix/bin" >> "$GITHUB_PATH"

      - name: Assert toolchain contract
        run: node scripts/ci/toolchain-contract.mjs assert

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Assert Playwright image contract
        run: |
          installed_version="$(node -p "require('./node_modules/@playwright/test/package.json').version")"
          test "$installed_version" = "$PLAYWRIGHT_IMAGE_VERSION"
          test -d /ms-playwright

      - name: Run mocked browser workflow
        id: e2e
        run: npm run test:e2e:mock

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 3

      - name: Write mocked E2E summary
        if: always()
        env:
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
        run: |
          {
            echo "## Mocked Web E2E"
            echo ""
            echo "Result: ${E2E_OUTCOME:-skipped}."
            echo ""
            echo "This suite runs the real Vite UI against browser MSW, not the local backend stack."
          } >> "$GITHUB_STEP_SUMMARY"

  docker_policy:
    name: Docker Policy
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-docker-policy.yml
    with:
      run_docker: ${{ inputs.run_docker || false }}

  all_checks_passed:
    name: All Checks Passed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs:
      - quality
      - web_e2e_scope
      - mocked_web_e2e
      - docker_policy
    if: always()
    steps:
      - name: Write aggregate summary and evaluate results
        env:
          DOCKER_RESULT: ${{ needs.docker_policy.result }}
          E2E_RESULT: ${{ needs.mocked_web_e2e.result }}
          E2E_REQUIRED: ${{ needs.web_e2e_scope.outputs.required }}
          E2E_SCOPE_RESULT: ${{ needs.web_e2e_scope.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: |
          set -euo pipefail

          {
            echo "## Required Checks"
            echo ""
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| Quality | ${QUALITY_RESULT} |"
            echo "| Web E2E Scope | ${E2E_SCOPE_RESULT} (${E2E_REQUIRED:-unknown}) |"
            echo "| Mocked Web E2E | ${E2E_RESULT} |"
            echo "| Docker Policy | ${DOCKER_RESULT} |"
          } >> "$GITHUB_STEP_SUMMARY"

          failed=false
          for result in "$QUALITY_RESULT" "$E2E_SCOPE_RESULT" "$DOCKER_RESULT"; do
            if [[ "$result" != "success" ]]; then
              failed=true
            fi
          done

          if [[ "$E2E_REQUIRED" == "true" && "$E2E_RESULT" != "success" ]]; then
            failed=true
          elif [[ "$E2E_REQUIRED" == "false" && "$E2E_RESULT" != "skipped" ]]; then
            failed=true
          elif [[ "$E2E_REQUIRED" != "true" && "$E2E_REQUIRED" != "false" ]]; then
            failed=true
          fi

          if [[ "$failed" == "true" ]]; then
            echo "One or more required jobs failed, were cancelled, or were skipped."
            exit 1
          fi

          echo "All required jobs passed."
