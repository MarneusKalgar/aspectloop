services:
  gateway-api:
    image: ${COMPOSE_PROJECT_NAME:-aspectloop_api_local}_gateway_api
    container_name: ${COMPOSE_PROJECT_NAME:-aspectloop_api_local}-gateway-api
    build:
      context: ../..
      dockerfile: ./apps/gateway-api/Dockerfile.dev
    init: true
    env_file:
      - ../../apps/gateway-api/.env.local
    ports:
      - '${API_PORT:-8080}:${API_PORT:-8080}'
    volumes:
      - ../../apps/gateway-api/src:/app/apps/gateway-api/src
      - ../../apps/gateway-api/tsconfig.app.json:/app/apps/gateway-api/tsconfig.app.json:ro
      - ../../apps/gateway-api/tsconfig.json:/app/apps/gateway-api/tsconfig.json:ro
      - ../../tsconfig.base.json:/app/tsconfig.base.json:ro
      - /app/node_modules
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:' + (process.env.API_PORT || '8080') +
          '/health').then((response) => { if (!response.ok) process.exit(1);
          }).catch(() => process.exit(1));
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      persistence-mock:
        condition: service_healthy

  postgres:
    image: postgres:18.6-alpine3.23@sha256:697c180dbf244d3ce4a8f4cbc0156cde840af055c1bf8b76aebe422a4822086f
    container_name: ${COMPOSE_PROJECT_NAME:-aspectloop_api_local}-postgres
    command:
      - postgres
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-100}
      - -c
      - superuser_reserved_connections=${POSTGRES_SUPERUSER_RESERVED_CONNECTIONS:-3}
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-aspectloop_admin}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-aspectloop_admin}
      POSTGRES_DB: ${POSTGRES_ADMIN_DATABASE:-postgres}
      POSTGRES_INITDB_ARGS: --data-checksums
      POSTGRES_MAX_CONNECTIONS: ${POSTGRES_MAX_CONNECTIONS:-100}
      POSTGRES_SUPERUSER_RESERVED_CONNECTIONS: ${POSTGRES_SUPERUSER_RESERVED_CONNECTIONS:-3}
      PLATFORM_DATABASE_NAME: ${PLATFORM_DATABASE_NAME:-platform_db}
      PLATFORM_DATABASE_USER: ${PLATFORM_DATABASE_USER:-platform_app}
      PLATFORM_DATABASE_PASSWORD: ${PLATFORM_DATABASE_PASSWORD:-platform_app}
      EXTRACTION_DATABASE_NAME: ${EXTRACTION_DATABASE_NAME:-extraction_db}
      EXTRACTION_DATABASE_USER: ${EXTRACTION_DATABASE_USER:-extraction_app}
      EXTRACTION_DATABASE_PASSWORD: ${EXTRACTION_DATABASE_PASSWORD:-extraction_app}
      CORRECTION_DATABASE_NAME: ${CORRECTION_DATABASE_NAME:-correction_db}
      CORRECTION_DATABASE_USER: ${CORRECTION_DATABASE_USER:-correction_app}
      CORRECTION_DATABASE_PASSWORD: ${CORRECTION_DATABASE_PASSWORD:-correction_app}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD', '/bin/bash', '/usr/local/bin/aspectloop-postgres-healthcheck']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - aspectloop_api_postgres18_data:/var/lib/postgresql
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-aspectloop-databases.sh:ro
      - ./postgres/healthcheck.sh:/usr/local/bin/aspectloop-postgres-healthcheck:ro

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-aspectloop_api_local}-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-aspectloop}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-aspectloop}
    ports:
      - '${RABBITMQ_PORT:-5672}:${RABBITMQ_PORT:-5672}'
      - '${RABBITMQ_MANAGEMENT_PORT:-15672}:${RABBITMQ_MANAGEMENT_PORT:-15672}'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  persistence-mock:
    image: ${COMPOSE_PROJECT_NAME:-aspectloop_api_local}_persistence_mock
    container_name: ${COMPOSE_PROJECT_NAME:-aspectloop_api_local}-persistence-mock
    build:
      context: ../../mocks/persistence-service
      dockerfile: ./Dockerfile.dev
    init: true
    env_file:
      - ../../apps/gateway-api/.env.local
    environment:
      PERSISTENCE_MOCK_DATA_DIR: ${PERSISTENCE_MOCK_DATA_DIR:-/data/documents}
    ports:
      - '${PERSISTENCE_MOCK_PORT:-8090}:${PERSISTENCE_MOCK_PORT:-8090}'
    volumes:
      - ../../mocks/persistence-service/src:/app/src
      - aspectloop_api_persistence_mock_data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:' + (process.env.PERSISTENCE_MOCK_PORT ||
          '8090') + '/health').then((response) => { if (!response.ok)
          process.exit(1); }).catch(() => process.exit(1));
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  migrate:
    image: ${COMPOSE_PROJECT_NAME:-aspectloop_api_local}_migrate_tmp
    container_name: ${COMPOSE_PROJECT_NAME:-aspectloop_api_local}-migrate
    build:
      context: ../..
      dockerfile: ./apps/gateway-api/Dockerfile.dev
    env_file:
      - ../../apps/gateway-api/.env.local
    volumes:
      - ../../apps/gateway-api/src:/app/apps/gateway-api/src
      - ../../apps/gateway-api/tsconfig.app.json:/app/apps/gateway-api/tsconfig.app.json:ro
      - ../../apps/gateway-api/tsconfig.json:/app/apps/gateway-api/tsconfig.json:ro
      - ../../tsconfig.base.json:/app/tsconfig.base.json:ro
      - /app/node_modules
    command: ['npm', 'run', 'db:migrate:local']
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools

  seed:
    image: ${COMPOSE_PROJECT_NAME:-aspectloop_api_local}_seed_tmp
    container_name: ${COMPOSE_PROJECT_NAME:-aspectloop_api_local}-seed
    build:
      context: ../..
      dockerfile: ./apps/gateway-api/Dockerfile.dev
    env_file:
      - ../../apps/gateway-api/.env.local
    volumes:
      - ../../apps/gateway-api/src:/app/apps/gateway-api/src
      - ../../apps/gateway-api/tsconfig.app.json:/app/apps/gateway-api/tsconfig.app.json:ro
      - ../../apps/gateway-api/tsconfig.json:/app/apps/gateway-api/tsconfig.json:ro
      - ../../tsconfig.base.json:/app/tsconfig.base.json:ro
      - /app/node_modules
    command: ['npm', 'run', 'db:seed:local']
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools

  role-verify:
    image: postgres:18.6-alpine3.23@sha256:697c180dbf244d3ce4a8f4cbc0156cde840af055c1bf8b76aebe422a4822086f
    container_name: ${COMPOSE_PROJECT_NAME:-aspectloop_api_local}-role-verify
    environment:
      PGHOST: postgres
      PGPORT: 5432
      POSTGRES_ADMIN_USER: ${POSTGRES_ADMIN_USER:-aspectloop_admin}
      POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-aspectloop_admin}
      POSTGRES_ADMIN_DATABASE: ${POSTGRES_ADMIN_DATABASE:-postgres}
      POSTGRES_MAX_CONNECTIONS: ${POSTGRES_MAX_CONNECTIONS:-100}
      POSTGRES_SUPERUSER_RESERVED_CONNECTIONS: ${POSTGRES_SUPERUSER_RESERVED_CONNECTIONS:-3}
      POSTGRES_OPERATIONAL_HEADROOM: ${POSTGRES_OPERATIONAL_HEADROOM:-20}
      POSTGRES_TOOL_CONNECTION_BUDGET: ${POSTGRES_TOOL_CONNECTION_BUDGET:-6}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      PLATFORM_DATABASE_NAME: ${PLATFORM_DATABASE_NAME:-platform_db}
      PLATFORM_DATABASE_USER: ${PLATFORM_DATABASE_USER:-platform_app}
      PLATFORM_DATABASE_PASSWORD: ${PLATFORM_DATABASE_PASSWORD:-platform_app}
      EXTRACTION_DATABASE_NAME: ${EXTRACTION_DATABASE_NAME:-extraction_db}
      EXTRACTION_DATABASE_USER: ${EXTRACTION_DATABASE_USER:-extraction_app}
      EXTRACTION_DATABASE_PASSWORD: ${EXTRACTION_DATABASE_PASSWORD:-extraction_app}
      CORRECTION_DATABASE_NAME: ${CORRECTION_DATABASE_NAME:-correction_db}
      CORRECTION_DATABASE_USER: ${CORRECTION_DATABASE_USER:-correction_app}
      CORRECTION_DATABASE_PASSWORD: ${CORRECTION_DATABASE_PASSWORD:-correction_app}
    volumes:
      - ./postgres/verify-roles.sh:/usr/local/bin/aspectloop-role-verify:ro
    command: ['/bin/bash', '/usr/local/bin/aspectloop-role-verify']
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools

volumes:
  # The legacy PG16 volume is intentionally undeclared so M04-C cannot attach
  # it to PG18 or remove it through the current Compose volume graph.
  aspectloop_api_postgres18_data:
  aspectloop_api_persistence_mock_data:
