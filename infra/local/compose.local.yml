services:
  gateway-api:
    image: ${COMPOSE_PROJECT_NAME:-aspectloop_api_local}_gateway_api
    container_name: ${COMPOSE_PROJECT_NAME:-aspectloop_api_local}-gateway-api
    build:
      context: ../..
      dockerfile: ./apps/gateway-api/Dockerfile.dev
    init: true
    env_file:
      - ../../apps/gateway-api/.env.local
    ports:
      - '${API_PORT:-8080}:${API_PORT:-8080}'
    volumes:
      - ../../apps/gateway-api/src:/app/apps/gateway-api/src
      - ../../apps/gateway-api/tsconfig.app.json:/app/apps/gateway-api/tsconfig.app.json:ro
      - ../../apps/gateway-api/tsconfig.json:/app/apps/gateway-api/tsconfig.json:ro
      - ../../tsconfig.base.json:/app/tsconfig.base.json:ro
      - /app/node_modules
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:' + (process.env.API_PORT || '8080') +
          '/health').then((response) => { if (!response.ok) process.exit(1);
          }).catch(() => process.exit(1));
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      persistence-mock:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-aspectloop_api_local}-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aspectloop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aspectloop}
      POSTGRES_DB: ${POSTGRES_DB:-aspectloop}
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - aspectloop_api_postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-aspectloop_api_local}-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-aspectloop}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-aspectloop}
    ports:
      - '${RABBITMQ_PORT:-5672}:${RABBITMQ_PORT:-5672}'
      - '${RABBITMQ_MANAGEMENT_PORT:-15672}:${RABBITMQ_MANAGEMENT_PORT:-15672}'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  persistence-mock:
    image: ${COMPOSE_PROJECT_NAME:-aspectloop_api_local}_persistence_mock
    container_name: ${COMPOSE_PROJECT_NAME:-aspectloop_api_local}-persistence-mock
    build:
      context: ../../mocks/persistence-service
      dockerfile: ./Dockerfile.dev
    init: true
    env_file:
      - ../../apps/gateway-api/.env.local
    environment:
      PERSISTENCE_MOCK_DATA_DIR: ${PERSISTENCE_MOCK_DATA_DIR:-/data/documents}
    ports:
      - '${PERSISTENCE_MOCK_PORT:-8090}:${PERSISTENCE_MOCK_PORT:-8090}'
    volumes:
      - ../../mocks/persistence-service/src:/app/src
      - aspectloop_api_persistence_mock_data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:' + (process.env.PERSISTENCE_MOCK_PORT ||
          '8090') + '/health').then((response) => { if (!response.ok)
          process.exit(1); }).catch(() => process.exit(1));
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  migrate:
    image: ${COMPOSE_PROJECT_NAME:-aspectloop_api_local}_migrate_tmp
    container_name: ${COMPOSE_PROJECT_NAME:-aspectloop_api_local}-migrate
    build:
      context: ../..
      dockerfile: ./apps/gateway-api/Dockerfile.dev
    env_file:
      - ../../apps/gateway-api/.env.local
    volumes:
      - ../../apps/gateway-api/src:/app/apps/gateway-api/src
      - ../../apps/gateway-api/tsconfig.app.json:/app/apps/gateway-api/tsconfig.app.json:ro
      - ../../apps/gateway-api/tsconfig.json:/app/apps/gateway-api/tsconfig.json:ro
      - ../../tsconfig.base.json:/app/tsconfig.base.json:ro
      - /app/node_modules
    command: ['npm', 'run', 'db:migrate:local']
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools

  seed:
    image: ${COMPOSE_PROJECT_NAME:-aspectloop_api_local}_seed_tmp
    container_name: ${COMPOSE_PROJECT_NAME:-aspectloop_api_local}-seed
    build:
      context: ../..
      dockerfile: ./apps/gateway-api/Dockerfile.dev
    env_file:
      - ../../apps/gateway-api/.env.local
    volumes:
      - ../../apps/gateway-api/src:/app/apps/gateway-api/src
      - ../../apps/gateway-api/tsconfig.app.json:/app/apps/gateway-api/tsconfig.app.json:ro
      - ../../apps/gateway-api/tsconfig.json:/app/apps/gateway-api/tsconfig.json:ro
      - ../../tsconfig.base.json:/app/tsconfig.base.json:ro
      - /app/node_modules
    command: ['npm', 'run', 'db:seed:local']
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools

volumes:
  aspectloop_api_postgres_data:
  aspectloop_api_persistence_mock_data:
