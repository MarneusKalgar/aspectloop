services:
  gateway-api:
    image: ${COMPOSE_PROJECT_NAME:-elemika_api_local}_gateway_api
    container_name: ${COMPOSE_PROJECT_NAME:-elemika_api_local}-gateway-api
    build:
      context: ../..
      dockerfile: ./apps/gateway-api/Dockerfile.dev
    init: true
    env_file:
      - ../../apps/gateway-api/.env.local
    ports:
      - '${API_PORT:-8080}:${API_PORT:-8080}'
    volumes:
      - ../../apps/gateway-api/src:/app/apps/gateway-api/src
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      persistence-mock:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-elemika_api_local}-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-elemika}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-elemika}
      POSTGRES_DB: ${POSTGRES_DB:-elemika}
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U elemika -d elemika']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - elemika_api_postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-elemika_api_local}-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-elemika}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-elemika}
    ports:
      - '${RABBITMQ_PORT:-5672}:${RABBITMQ_PORT:-5672}'
      - '${RABBITMQ_MANAGEMENT_PORT:-15672}:${RABBITMQ_MANAGEMENT_PORT:-15672}'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  persistence-mock:
    image: ${COMPOSE_PROJECT_NAME:-elemika_api_local}_persistence_mock
    container_name: ${COMPOSE_PROJECT_NAME:-elemika_api_local}-persistence-mock
    build:
      context: ../../mocks/persistence-service
      dockerfile: ./Dockerfile.dev
    init: true
    env_file:
      - ../../apps/gateway-api/.env.local
    environment:
      PERSISTENCE_MOCK_DATA_DIR: ${PERSISTENCE_MOCK_DATA_DIR:-/data/documents}
    ports:
      - '${PERSISTENCE_MOCK_PORT:-8090}:${PERSISTENCE_MOCK_PORT:-8090}'
    volumes:
      - ../../mocks/persistence-service/src:/app/src
      - elemika_api_persistence_mock_data:/data

  migrate:
    image: ${COMPOSE_PROJECT_NAME:-elemika_api_local}_migrate_tmp
    container_name: ${COMPOSE_PROJECT_NAME:-elemika_api_local}-migrate
    build:
      context: ../..
      dockerfile: ./apps/gateway-api/Dockerfile.dev
    env_file:
      - ../../apps/gateway-api/.env.local
    volumes:
      - ../../apps/gateway-api/src:/app/apps/gateway-api/src
      - /app/node_modules
    command: ['npm', 'run', 'db:migrate:local']
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools

  seed:
    image: ${COMPOSE_PROJECT_NAME:-elemika_api_local}_seed_tmp
    container_name: ${COMPOSE_PROJECT_NAME:-elemika_api_local}-seed
    build:
      context: ../..
      dockerfile: ./apps/gateway-api/Dockerfile.dev
    env_file:
      - ../../apps/gateway-api/.env.local
    volumes:
      - ../../apps/gateway-api/src:/app/apps/gateway-api/src
      - /app/node_modules
    command: ['npm', 'run', 'db:seed:local']
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools

volumes:
  elemika_api_postgres_data:
  elemika_api_persistence_mock_data:
