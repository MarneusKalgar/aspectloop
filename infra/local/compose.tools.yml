services:
  pgadmin:
    image: dpage/pgadmin4:9.17@sha256:2f4ce946ddf8360680d7eff4eaba1d91859eb6b4003e6623bad5c63a322c2f4d
    container_name: ${COMPOSE_PROJECT_NAME:-aspectloop_api_local}-pgadmin
    init: true
    environment:
      # prepare.mjs enforces both values when the optional profile is requested.
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-}
      PGADMIN_DISABLE_POSTFIX: 'true'
      PGADMIN_LISTEN_PORT: '5050'
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: 'True'
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    ports:
      # The administration UI is intentionally unavailable outside this host.
      - '127.0.0.1:${PGADMIN_PORT:-5050}:5050'
    volumes:
      - ./pgadmin/servers.local.json:/pgadmin4/servers.json:ro
      - aspectloop_api_pgadmin_data:/var/lib/pgadmin
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --output-document=-
        - http://127.0.0.1:5050/misc/ping
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - devtools

  database-provision:
    image: postgres:18.6-alpine3.23@sha256:697c180dbf244d3ce4a8f4cbc0156cde840af055c1bf8b76aebe422a4822086f
    environment:
      PGHOST: postgres
      PGPORT: 5432
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-aspectloop_admin}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-aspectloop_admin}
      POSTGRES_DB: ${POSTGRES_ADMIN_DATABASE:-postgres}
      PLATFORM_DATABASE_NAME: ${PLATFORM_DATABASE_NAME:-platform_db}
      PLATFORM_MIGRATOR_USER: ${PLATFORM_MIGRATOR_USER:-platform_migrator}
      PLATFORM_MIGRATOR_PASSWORD: ${PLATFORM_MIGRATOR_PASSWORD:-platform_migrator}
      PLATFORM_RUNTIME_USER: ${PLATFORM_RUNTIME_USER:-platform_runtime}
      PLATFORM_RUNTIME_PASSWORD: ${PLATFORM_RUNTIME_PASSWORD:-platform_runtime}
      GATEWAY_CORRECTION_RUNTIME_USER: ${GATEWAY_CORRECTION_RUNTIME_USER:-gateway_correction_runtime}
      GATEWAY_CORRECTION_RUNTIME_PASSWORD: ${GATEWAY_CORRECTION_RUNTIME_PASSWORD:-gateway_correction_runtime}
      EXTRACTION_DATABASE_NAME: ${EXTRACTION_DATABASE_NAME:-extraction_db}
      EXTRACTION_DATABASE_USER: ${EXTRACTION_DATABASE_USER:-extraction_app}
      EXTRACTION_DATABASE_PASSWORD: ${EXTRACTION_DATABASE_PASSWORD:-extraction_app}
      CORRECTION_DATABASE_NAME: ${CORRECTION_DATABASE_NAME:-correction_db}
      CORRECTION_DATABASE_USER: ${CORRECTION_DATABASE_USER:-correction_app}
      CORRECTION_DATABASE_PASSWORD: ${CORRECTION_DATABASE_PASSWORD:-correction_app}
    volumes:
      - ./postgres/init-databases.sh:/usr/local/bin/aspectloop-db-provision:ro
    command: ['/bin/bash', '/usr/local/bin/aspectloop-db-provision']
    profiles:
      - tools

  platform-migrator:
    image: ${COMPOSE_PROJECT_NAME:-aspectloop_api_local}_platform_service
    build:
      context: ../..
      dockerfile: ./apps/platform-service/Dockerfile.dev
    init: true
    environment:
      DATABASE_URL: postgresql://${PLATFORM_MIGRATOR_USER:-platform_migrator}:${PLATFORM_MIGRATOR_PASSWORD:-platform_migrator}@postgres:5432/${PLATFORM_DATABASE_NAME:-platform_db}
      DB_POOL_SIZE: 5
      DB_SLOW_QUERY_THRESHOLD_MS: 1000
      JWT_ACCESS_SECRET: migration-tool-unused
      NODE_ENV: development
      PLATFORM_S3_ACCESS_KEY_ID: migration-tool-unused
      PLATFORM_S3_BUCKET: migration-tool-unused
      PLATFORM_S3_SECRET_ACCESS_KEY: migration-tool-unused
      S3_ENDPOINT: http://127.0.0.1:3900
      S3_FORCE_PATH_STYLE: 'true'
      S3_REGION: garage
    volumes:
      - ../../apps/platform-service/src:/app/apps/platform-service/src
      - ../../apps/platform-service/tsconfig.app.json:/app/apps/platform-service/tsconfig.app.json:ro
      - ../../apps/platform-service/tsconfig.json:/app/apps/platform-service/tsconfig.json:ro
      - ../../tsconfig.base.json:/app/tsconfig.base.json:ro
    profiles:
      - tools

  role-verify:
    image: postgres:18.6-alpine3.23@sha256:697c180dbf244d3ce4a8f4cbc0156cde840af055c1bf8b76aebe422a4822086f
    container_name: ${COMPOSE_PROJECT_NAME:-aspectloop_api_local}-role-verify
    environment:
      PGHOST: postgres
      PGPORT: 5432
      POSTGRES_ADMIN_USER: ${POSTGRES_ADMIN_USER:-aspectloop_admin}
      POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-aspectloop_admin}
      POSTGRES_ADMIN_DATABASE: ${POSTGRES_ADMIN_DATABASE:-postgres}
      POSTGRES_MAX_CONNECTIONS: ${POSTGRES_MAX_CONNECTIONS:-100}
      POSTGRES_SUPERUSER_RESERVED_CONNECTIONS: ${POSTGRES_SUPERUSER_RESERVED_CONNECTIONS:-3}
      POSTGRES_OPERATIONAL_HEADROOM: ${POSTGRES_OPERATIONAL_HEADROOM:-20}
      POSTGRES_TOOL_CONNECTION_BUDGET: ${POSTGRES_TOOL_CONNECTION_BUDGET:-6}
      GATEWAY_DB_POOL_SIZE: ${GATEWAY_DB_POOL_SIZE:-5}
      PLATFORM_DB_POOL_SIZE: ${PLATFORM_DB_POOL_SIZE:-5}
      EXTRACTION_DB_POOL_SIZE: ${EXTRACTION_DB_POOL_SIZE:-10}
      CORRECTION_DB_POOL_SIZE: ${CORRECTION_DB_POOL_SIZE:-10}
      PLATFORM_DATABASE_NAME: ${PLATFORM_DATABASE_NAME:-platform_db}
      PLATFORM_MIGRATOR_USER: ${PLATFORM_MIGRATOR_USER:-platform_migrator}
      PLATFORM_MIGRATOR_PASSWORD: ${PLATFORM_MIGRATOR_PASSWORD:-platform_migrator}
      PLATFORM_RUNTIME_USER: ${PLATFORM_RUNTIME_USER:-platform_runtime}
      PLATFORM_RUNTIME_PASSWORD: ${PLATFORM_RUNTIME_PASSWORD:-platform_runtime}
      GATEWAY_CORRECTION_RUNTIME_USER: ${GATEWAY_CORRECTION_RUNTIME_USER:-gateway_correction_runtime}
      GATEWAY_CORRECTION_RUNTIME_PASSWORD: ${GATEWAY_CORRECTION_RUNTIME_PASSWORD:-gateway_correction_runtime}
      EXTRACTION_DATABASE_NAME: ${EXTRACTION_DATABASE_NAME:-extraction_db}
      EXTRACTION_DATABASE_USER: ${EXTRACTION_DATABASE_USER:-extraction_app}
      EXTRACTION_DATABASE_PASSWORD: ${EXTRACTION_DATABASE_PASSWORD:-extraction_app}
      CORRECTION_DATABASE_NAME: ${CORRECTION_DATABASE_NAME:-correction_db}
      CORRECTION_DATABASE_USER: ${CORRECTION_DATABASE_USER:-correction_app}
      CORRECTION_DATABASE_PASSWORD: ${CORRECTION_DATABASE_PASSWORD:-correction_app}
    volumes:
      - ./postgres/verify-roles.sh:/usr/local/bin/aspectloop-role-verify:ro
    command: ['/bin/bash', '/usr/local/bin/aspectloop-role-verify']
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools

volumes:
  # Preserve pgAdmin preferences independently of its optional container.
  aspectloop_api_pgadmin_data:
