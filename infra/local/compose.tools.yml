services:
  pgadmin:
    image: dpage/pgadmin4:9.17@sha256:2f4ce946ddf8360680d7eff4eaba1d91859eb6b4003e6623bad5c63a322c2f4d
    container_name: ${COMPOSE_PROJECT_NAME:-aspectloop_api_local}-pgadmin
    init: true
    environment:
      # prepare.mjs enforces both values when the optional profile is requested.
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-}
      PGADMIN_DISABLE_POSTFIX: 'true'
      PGADMIN_LISTEN_PORT: '5050'
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: 'True'
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    ports:
      # The administration UI is intentionally unavailable outside this host.
      - '127.0.0.1:${PGADMIN_PORT:-5050}:5050'
    volumes:
      - ./pgadmin/servers.local.json:/pgadmin4/servers.json:ro
      - aspectloop_api_pgadmin_data:/var/lib/pgadmin
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --output-document=-
        - http://127.0.0.1:5050/misc/ping
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - devtools

  database-provision:
    image: postgres:18.6-alpine3.23@sha256:697c180dbf244d3ce4a8f4cbc0156cde840af055c1bf8b76aebe422a4822086f
    env_file:
      - ./postgres/control-plane.env
    environment:
      PGHOST: postgres
      PGPORT: 5432
    volumes:
      - ./postgres/init-databases.sh:/usr/local/bin/aspectloop-db-provision:ro
    command: ['/bin/bash', '/usr/local/bin/aspectloop-db-provision']
    profiles:
      - tools

  platform-migrator:
    image: ${COMPOSE_PROJECT_NAME:-aspectloop_api_local}_platform_service
    build:
      context: ../..
      dockerfile: ./apps/platform-service/Dockerfile.dev
    init: true
    environment:
      DATABASE_URL: postgresql://${PLATFORM_MIGRATOR_USER:-platform_migrator}:${PLATFORM_MIGRATOR_PASSWORD:-platform_migrator}@postgres:5432/${PLATFORM_DATABASE_NAME:-platform_db}
      DB_POOL_SIZE: 5
      DB_SLOW_QUERY_THRESHOLD_MS: 1000
      NODE_ENV: development
    volumes:
      - ../../apps/platform-service/src:/app/apps/platform-service/src
      - ../../apps/platform-service/tsconfig.app.json:/app/apps/platform-service/tsconfig.app.json:ro
      - ../../apps/platform-service/tsconfig.json:/app/apps/platform-service/tsconfig.json:ro
      - ../../tsconfig.base.json:/app/tsconfig.base.json:ro
    profiles:
      - tools

  platform-auth-verify:
    image: ${COMPOSE_PROJECT_NAME:-aspectloop_api_local}_platform_service
    build:
      context: ../..
      dockerfile: ./apps/platform-service/Dockerfile.dev
    init: true
    env_file:
      - ../../apps/platform-service/.env.local
    environment:
      AUTH_VERIFY_CLEANUP_DATABASE_URL: postgresql://${PLATFORM_MIGRATOR_USER:-platform_migrator}:${PLATFORM_MIGRATOR_PASSWORD:-platform_migrator}@postgres:5432/${PLATFORM_DATABASE_NAME:-platform_db}
      DATABASE_URL: postgresql://${PLATFORM_RUNTIME_USER:-platform_runtime}:${PLATFORM_RUNTIME_PASSWORD:-platform_runtime}@postgres:5432/${PLATFORM_DATABASE_NAME:-platform_db}
      DB_POOL_SIZE: 5
      NODE_ENV: development
    volumes:
      - ../../apps/platform-service/src:/app/apps/platform-service/src
      - ../../apps/platform-service/tsconfig.app.json:/app/apps/platform-service/tsconfig.app.json:ro
      - ../../apps/platform-service/tsconfig.json:/app/apps/platform-service/tsconfig.json:ro
      - ../../tsconfig.base.json:/app/tsconfig.base.json:ro
    command: ['npm', 'run', 'db:auth:sessions:verify:local']
    profiles:
      - tools

  role-verify:
    image: postgres:18.6-alpine3.23@sha256:697c180dbf244d3ce4a8f4cbc0156cde840af055c1bf8b76aebe422a4822086f
    container_name: ${COMPOSE_PROJECT_NAME:-aspectloop_api_local}-role-verify
    env_file:
      - ./postgres/control-plane.env
    environment:
      PGHOST: postgres
      PGPORT: 5432
    volumes:
      - ./postgres/verify-roles.sh:/usr/local/bin/aspectloop-role-verify:ro
    command: ['/bin/bash', '/usr/local/bin/aspectloop-role-verify']
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools

volumes:
  # Preserve pgAdmin preferences independently of its optional container.
  aspectloop_api_pgadmin_data:
